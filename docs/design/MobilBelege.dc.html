<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mobil Belege</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined&amp;display=block">
<style>
body{margin:0}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:-5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font:500 12px 'IBM Plex Sans',sans-serif;white-space:nowrap}
.t-blue{background:#E7E7F4;color:#2F2D86}.t-orange{background:#FDF0E3;color:#A44A06}.t-green{background:#E5F4EC;color:#17703F}.t-red{background:#FDECEA;color:#B42318}.t-gray{background:#EEF0F3;color:#4A5262}.t-purple{background:#F0EAFB;color:#5B2EA6}
.num{font-variant-numeric:tabular-nums}
.thumb{position:relative;display:flex;align-items:center;justify-content:center;background:#E9ECF1;overflow:hidden}
.pg{background:#FFFFFF;box-shadow:0 1px 4px rgba(21,25,34,0.18);box-sizing:border-box;display:flex;flex-direction:column;gap:3px}
.ln{display:block;height:3px;border-radius:1px;background:#DDE1E7}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{animation:sheetUp 260ms cubic-bezier(0.2,0.8,0.2,1)}
.scrim{animation:fadeIn 200ms ease-out}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 4px;border:0;border-bottom:1px solid #EEF0F3;background:transparent;font:400 15px 'IBM Plex Sans',sans-serif;color:#151922;text-align:left;cursor:pointer}
.grp-h{margin:0;padding:16px 4px 4px;font:600 12px 'IBM Plex Sans',sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#5E6676}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F5F7; font-family: 'IBM Plex Sans', sans-serif; color: #151922; overflow: hidden">
  <header style="padding: 16px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 10px">
    <span style="font-weight: 600; font-size: 17px; line-height: 28px">Belege</span>
    <div style="display: flex; gap: 8px">
      <label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #F0F2F5"><span class="material-symbols-outlined" aria-hidden="true" style="color: #5E6676">search</span><input type="search" aria-label="Belege durchsuchen" placeholder="Volltext durchsuchen" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 400 15px 'IBM Plex Sans', sans-serif"></label>
      <button type="button" onClick="{{ openSheet }}" aria-label="{{ filterAria }}" aria-haspopup="dialog" style="position: relative; flex: none; width: 44px; height: 44px; border-radius: 10px; background: {{ fBg }}; color: {{ fFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer; border-style: none">
        <span class="material-symbols-outlined" aria-hidden="true" style="font-size: 28px; vertical-align: 0">filter_alt</span>
        <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #B42318; color: #FFFFFF; font: 700 11px 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">{{ activeCount }}</span></sc-if>
      </button>
    </div>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <a href="MobilBelegDetail.dc.html" style="display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; text-decoration: none; color: #151922">
          <span class="thumb" style="height: 124px">
            <span class="pg" style="width: 80px; height: 110px; padding: 8px 7px">
              <span style="display: flex; align-items: center; gap: 3px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ r.lf }}"></span><span class="ln" style="width: 28px; background: {{ r.lf }}; opacity: 0.55"></span></span>
              <span class="ln" style="width: 52%; margin-top: 3px"></span><span class="ln" style="width: 40%"></span>
              <span style="margin-top: 4px; border-top: 2px solid {{ r.lf }}; padding-top: 3px; display: flex; flex-direction: column; gap: 3px"><span class="ln"></span><span class="ln"></span><span class="ln" style="width: 70%"></span></span>
              <span style="flex: 1"></span>
              <span style="display: flex; justify-content: flex-end"><span class="ln" style="width: 20px; height: 4px; background: #151922"></span></span>
            </span>
          </span>
          <span style="padding: 10px; display: flex; flex-direction: column; gap: 3px; border-top: 1px solid #E3E6EB">
            <span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.korr }}</span>
            <span class="num" style="font-weight: 600; font-size: 16px">{{ r.sum }}</span>
            <span style="font-size: 12px; color: {{ r.subFg }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.sub }}</span>
            <span style="display: flex; gap: 4px; margin-top: 5px; min-width: 0; overflow: hidden"><sc-for list="{{ r.tags }}" as="t" hint-placeholder-count="2"><span class="chip {{ t.cls }}">{{ t.label }}</span></sc-for><sc-if value="{{ r.hasMore }}" hint-placeholder-val="{{ false }}"><span class="chip t-gray" aria-label="{{ r.moreAria }}" title="{{ r.moreTitle }}">{{ r.more }}</span></sc-if></span>
          </span>
        </a>
      </sc-for>
    </div>
  </main>
  <dc-import name="MobilNav" active="belege" hint-size="390px,84px"></dc-import>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end">
      <button type="button" class="scrim" onClick="{{ closeSheet }}" aria-label="Filter schließen" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(21,25,34,0.45); cursor: pointer"></button>
      <section class="sheet" role="dialog" aria-modal="true" aria-label="Belege filtern" style="position: relative; max-height: 86%; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 24px rgba(21,25,34,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; margin-top: 8px; border-radius: 2px; background: #C9CED6"></span>
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 20px">
          <strong style="flex: 1; font-size: 17px">Filtern</strong>
          <button type="button" onClick="{{ resetSheet }}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #2F2D86; font: 500 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Zurücksetzen</button>
          <button type="button" onClick="{{ closeSheet }}" aria-label="Schließen" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #151922; display: flex; align-items: center; justify-content: center; cursor: pointer"><span class="material-symbols-outlined" aria-hidden="true" style="font-size: 24px; vertical-align: 0">close</span></button>
        </div>
        <div style="flex: 1; overflow-y: auto; padding: 0 16px 8px">
          <h3 class="grp-h" id="fg-status">Status</h3>
          <div role="radiogroup" aria-labelledby="fg-status">
            <sc-for list="{{ statusOpts }}" as="o" hint-placeholder-count="5">
              <button type="button" class="opt" role="radio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}">
                <span style="flex: 1">{{ o.label }}</span>
                <span class="num" style="font-size: 13px; color: #5E6676">{{ o.count }}</span>
                <span class="material-symbols-outlined" aria-hidden="true" style="font-size: 22px; vertical-align: 0; color: {{ o.ic }}">{{ o.icon }}</span>
              </button>
            </sc-for>
          </div>
          <h3 class="grp-h" id="fg-sort">Sortieren nach</h3>
          <div role="radiogroup" aria-labelledby="fg-sort">
            <sc-for list="{{ sortOpts }}" as="o" hint-placeholder-count="2">
              <button type="button" class="opt" role="radio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}">
                <span style="flex: 1">{{ o.label }}</span>
                <span class="material-symbols-outlined" aria-hidden="true" style="font-size: 22px; vertical-align: 0; color: {{ o.ic }}">{{ o.icon }}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="padding: 12px 16px 28px; border-top: 1px solid #E3E6EB">
          <button type="button" onClick="{{ applySheet }}" style="width: 100%; height: 48px; border: 0; border-radius: 10px; background: #2F2D86; color: #FFFFFF; font: 500 15px 'IBM Plex Sans', sans-serif; cursor: pointer">{{ applyLabel }}</button>
        </div>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { v: 'alle', s: 'datum', open: false, pv: 'alle', ps: 'datum' }; }
  renderVals() {
    const T = { inbox: { label: 'Inbox', cls: 't-blue' }, pruef: { label: 'zu prüfen', cls: 't-orange' }, bez: { label: 'bezahlt', cls: 't-green' }, ls: { label: 'Lastschrift', cls: 't-purple' }, ueber: { label: 'überfällig', cls: 't-red' } };
    const raw = [
      ['HS', '#E7E7F4', '#2F2D86', 'Hostwerk Süd GmbH', '489,00 €', '20.11.2026 · Software & Hosting', ['inbox'], 0],
      ['BK', '#FDF0E3', '#A44A06', 'Bürowelt Krämer KG', '264,00 €', '19.11.2026 · Bürobedarf', ['inbox', 'pruef'], 0],
      ['AB', '#DDF0EA', '#145C4B', 'Autohaus Brenner GmbH', '534,00 €', '18.11.2026 · Fahrzeug', ['bez'], 0],
      ['NT', '#E1F3F4', '#0E6168', 'Netzfunk Telekom AG', '186,00 €', '15.11.2026 · Telekommunikation', ['ls'], 0],
      ['SL', '#E7E7F4', '#2F2D86', 'Stadtwerke Lindenau', '118,40 €', '14.11.2026 · Sonstiges', ['inbox', 'pruef'], 0],
      ['DW', '#F0EAFB', '#5B2EA6', 'Druckerei Weller', '231,00 €', '12.11.2026 · Sonstiges', ['inbox', 'pruef'], 0],
      ['SL', '#E7E7F4', '#2F2D86', 'Stadtwerke Lindenau', '233,80 €', 'fällig 15.11.2026', ['ueber'], 1],
      ['EH', '#FDECEA', '#B42318', 'Elektro Haas e.K.', '178,50 €', 'fällig 28.10.2026', ['ueber', 'pruef', 'inbox'], 1]
    ];
    const st = this.state;
    const keepFor = (v) => (r) => v === 'alle' || (v === 'inbox' && r[6].includes('inbox')) || (v === 'pruef' && r[6].includes('pruef')) || (v === 'ueber' && r[7] === 1) || (v === 'offen' && !r[6].includes('bez') && !r[6].includes('ls'));
    const amount = (r) => parseFloat(r[4].replace(/[^0-9,]/g, '').replace(',', '.'));
    const list = (v, s) => {
      const l = raw.filter(keepFor(v));
      return s === 'betrag' ? l.slice().sort((a, b) => amount(b) - amount(a)) : l;
    };
    const radio = (on) => ({ on: on ? 'true' : 'false', icon: on ? 'radio_button_checked' : 'radio_button_unchecked', ic: on ? '#2F2D86' : '#8A92A1' });
    const so = (id, label, count) => Object.assign({ label, count, pick: () => this.setState({ pv: id }) }, radio(st.pv === id));
    const sr = (id, label) => Object.assign({ label, pick: () => this.setState({ ps: id }) }, radio(st.ps === id));
    const active = (st.v !== 'alle' ? 1 : 0) + (st.s !== 'datum' ? 1 : 0);
    const pendingCount = list(st.pv, st.ps).length;
    return {
      open: st.open,
      openSheet: () => this.setState({ open: true, pv: st.v, ps: st.s }),
      closeSheet: () => this.setState({ open: false }),
      resetSheet: () => this.setState({ pv: 'alle', ps: 'datum' }),
      applySheet: () => this.setState({ v: st.pv, s: st.ps, open: false }),
      applyLabel: pendingCount === 1 ? '1 Beleg anzeigen' : pendingCount + ' Belege anzeigen',
      hasActive: active > 0,
      activeCount: active,
      filterAria: active ? 'Filter, ' + active + ' aktiv' : 'Filter',
      fBg: active ? '#2F2D86' : '#FFFFFF',
      fFg: active ? '#FFFFFF' : '#2F2D86',
      fBd: '#2F2D86',
      statusOpts: [so('alle', 'Alle Belege', '248'), so('inbox', 'Inbox', '12'), so('pruef', 'Zu prüfen', '5'), so('offen', 'Offen', '9'), so('ueber', 'Überfällig', '2')],
      sortOpts: [sr('datum', 'Rechnungsdatum, neueste zuerst'), sr('betrag', 'Betrag, höchster zuerst')],
      rows: list(st.v, st.s).map((r) => ({ ini: r[0], lb: r[1], lf: r[2], korr: r[3], sum: r[4], sub: r[5], subFg: r[7] ? '#B42318' : '#5E6676', tags: r[6].slice(0, 2).map((t) => T[t]),
        hasMore: r[6].length > 2, more: '+' + (r[6].length - 2),
        moreTitle: r[6].slice(2).map((t) => T[t].label).join(', '),
        moreAria: (r[6].length - 2) + ' weitere: ' + r[6].slice(2).map((t) => T[t].label).join(', ') }))
    };
  }
}
</script>
</body>
</html>
