# Abhängigkeiten für die lokale Entwicklung: Die API läuft außerhalb von Docker (Rider/dotnet run),
# PostgreSQL, KoSIT und ein Test-Postfach laufen hier und sind auf dem Host erreichbar. Werte passen zu
# backend/src/Biber.Invoice.Api/appsettings.Development.json.
#   docker compose -f docker/compose.dev.yml up -d --build --wait
#   docker compose -f docker/compose.dev.yml down        # Daten bleiben erhalten
#   docker compose -f docker/compose.dev.yml down -v     # Datenbank leeren
name: biber-rechnungen-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rechnungen
      POSTGRES_PASSWORD: rechnungen
      POSTGRES_DB: rechnungen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechnungen -d rechnungen"]
      interval: 5s
      timeout: 3s
      retries: 20

  kosit:
    build: ./kosit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"

  # Test-Postfach für den Mail-Import: Mails per SMTP an localhost:3025 einliefern
  # (an rechnungen@dev.local), die API holt sie per IMAP von localhost:3143.
  # Speichert nur im Arbeitsspeicher, nach einem Neustart ist das Postfach leer.
  mail:
    image: greenmail/standalone:2.1.5
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=rechnungen:rechnungen@dev.local
        -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/3143"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
