name: CI

on:
  push:
  pull_request:
  # Wird vom Release-Workflow vor dem Push der Images aufgerufen.
  workflow_call:

concurrency:
  # Bei workflow_call ist github.workflow der Name des Aufrufers („Release“), die Gruppe also eine andere.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build backend/Biber.Invoice.sln -warnaserror

      - name: Format prüfen
        run: dotnet format backend/Biber.Invoice.sln --verify-no-changes

      # Die Integrationstests starten viele Hosts mit FileSystemWatchern; der Runner erlaubt nur 128 inotify-Instanzen.
      - name: inotify-Limit erhöhen
        run: sudo sysctl -w fs.inotify.max_user_instances=1024

      - name: Tests
        run: dotnet test backend/Biber.Invoice.sln --logger trx

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testergebnisse
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --reporter=list,html

      - name: Playwright-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  # End-to-End gegen das echte System (Docker Compose, Azure und IMAP gemockt), siehe e2e-system/.
  e2e-system:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-system/package-lock.json

      # lauf.sh installiert nur den Browser; die Systembibliotheken braucht der Runner einmalig.
      - name: Browser-Abhängigkeiten
        working-directory: e2e-system
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E-Lauf
        run: bash e2e-system/lauf.sh
        env:
          E2E_LOGS: ${{ runner.temp }}/docker-compose.log

      - name: Playwright-Bericht und Compose-Logs hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-system-bericht
          path: |
            e2e-system/playwright-report/
            e2e-system/test-results/
            ${{ runner.temp }}/docker-compose.log
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsskript testen
        run: bash .github/scripts/naechste-version.test.sh

      # hashFiles ist auf Job-Ebene nicht erlaubt; ohne docker/smoke.sh wird der Schritt übersprungen.
      - name: Smoke-Test
        if: hashFiles('docker/smoke.sh') != ''
        run: bash docker/smoke.sh
