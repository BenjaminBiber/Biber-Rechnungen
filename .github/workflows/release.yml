name: Release

on:
  workflow_dispatch:
    inputs:
      stufe:
        description: Welcher Teil der Version wird erhöht?
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

# Nie zwei Releases gleichzeitig; ein laufendes Release wird nicht abgebrochen.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Branch prüfen
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases laufen nur auf main (gestartet auf ${GITHUB_REF})."
          exit 1

      - name: Secrets prüfen
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          fehlt=0
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository-Secret DOCKERHUB_USERNAME fehlt."
            fehlt=1
          fi
          if [ -z "$DOCKERHUB_PASSWORD" ]; then
            echo "::error::Repository-Secret DOCKERHUB_PASSWORD fehlt."
            fehlt=1
          fi
          exit "$fehlt"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Version berechnen
        id: version
        env:
          STUFE: ${{ inputs.stufe }}
        run: |
          letzter="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          version="$(bash .github/scripts/naechste-version.sh "$letzter" "$STUFE")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} existiert bereits."
            exit 1
          fi
          echo "Letzter Tag: ${letzter:-keiner}, Stufe: ${STUFE}, neue Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  ci:
    needs: pruefen
    uses: ./.github/workflows/ci.yml

  images:
    needs: [pruefen, ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: biber-rechnungen-api
            context: .
            file: backend/src/Biber.Invoice.Api/Dockerfile
          - name: biber-rechnungen-kosit
            context: docker/kosit
            file: docker/kosit/Dockerfile
          - name: biber-rechnungen-db-backup
            context: docker/db-backup
            file: docker/db-backup/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            benjamin/${{ matrix.name }}:latest
            benjamin/${{ matrix.name }}:${{ needs.pruefen.outputs.version }}
          # Nur das api-Image wertet APP_VERSION aus.
          build-args: |
            APP_VERSION=${{ needs.pruefen.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  veroeffentlichen:
    needs: [pruefen, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag und GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pruefen.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
